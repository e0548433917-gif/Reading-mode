<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מצב קריאה</title>
<style>
:root{--font-ui:'Rubik',system-ui,sans-serif;--font-main:'FrankRuhlCLM',serif;--font-size:25px;--line-height:1.5;
 --surface:#fff;--onSurface:#1b1b1f;--onSurfaceVariant:#46464f;--primary:#4355b9;--onPrimary:#fff;--primaryContainer:#dfe0ff;
 --surfaceContainer:#f0edf1;--surfaceContainerHigh:#eae7ec;--surfaceContainerHighest:#e4e1e6;--outline:#777680;--secondaryContainer:#e1e0f9;--onSecondaryContainer:#191a2c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;font:14px var(--font-ui);background:var(--surface);color:var(--onSurface)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hov:hover,.ibtn:hover{background:color-mix(in srgb,var(--onSurface) 8%,transparent)}
.top{display:flex;align-items:center;height:52px;flex-shrink:0;background:var(--surfaceContainerHigh);gap:6px;padding-inline:10px}
#qs{flex:1;min-width:120px;max-width:560px;height:36px;padding:0 14px}
.tabrow{display:flex;align-items:center;height:42px;flex-shrink:0;background:var(--surfaceContainerHighest);padding-inline:8px;gap:6px}
body:not(:has(#libview.on)) #lvClose{display:none}
body.emb :is(#lvHome,#lvUp,#qs,#sideSeg,#lvMode,#lvClose,#tabrow){display:none}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:32px;min-width:32px;padding:0 8px;border-radius:8px;font-size:13px;white-space:nowrap;justify-content:center}
.ibtn.primary{background:var(--primary);color:var(--onPrimary);padding:0 14px;font-weight:500}
.ibtn.primary:hover{background:color-mix(in srgb,var(--onPrimary) 8%,var(--primary))}
.ibtn.sec{background:var(--secondaryContainer);color:var(--onSecondaryContainer)}
.ibtn[disabled]{opacity:.35;pointer-events:none}
.tabs{display:flex;flex:1;min-width:0;height:42px;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;flex:0 1 200px;min-width:90px;height:30px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline)}
.tab span.t{flex:1;min-width:0;padding:4px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab:hover:not(.active){background:color-mix(in srgb,var(--onSurface) 8%,transparent)}
.tab.active{background:var(--primaryContainer);color:var(--onPrimaryContainer);box-shadow:none;z-index:1}.tab.active .t{font-weight:700}
.tab .x{width:24px;height:24px;margin-inline-end:6px;font-size:18px;opacity:0;border-radius:8px}
.tab.active .x,.tab:hover .x{opacity:1}.tab .x:hover{background:color-mix(in srgb,var(--onSurface) 8%,transparent)}
.sp{flex:1}
#desk{flex:1;min-height:0;position:relative;background:var(--surface)}
#scroller{position:absolute;inset:0;overflow:auto;scrollbar-width:thin}
body.h #scroller{scroll-snap-type:x mandatory;scroll-behavior:smooth}
#strip{display:flex;gap:0;min-height:100%;width:max-content;align-items:flex-start}
body.v #strip{flex-direction:column;width:auto;align-items:center}
.slot{flex:none;scroll-snap-align:center;position:relative}
.sheet{position:relative;width:100%;height:100%;display:flex;gap:var(--cgap,40px);padding:var(--py,24px) var(--px,22px);color:var(--onSurface);animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.col{flex:none;overflow:hidden;font-family:var(--font-main);font-size:var(--fs);line-height:var(--lh);text-align:var(--align);text-align-last:var(--alast);font-weight:400}
.col.m{position:absolute;visibility:hidden;left:-99999px;top:0}
.col p,.col h1,.col h2,.col h3,.col h4,.col h5,.col h6{margin:0;padding:0}
.col p.cut{text-align-last:justify}
.col h1,.col h2,.col h3,.col h4,.col h5,.col h6{text-align:var(--halign);text-align-last:var(--halign);font-weight:700;line-height:var(--lh)}
.col h1{font-size:1.4em}.col h2{font-size:1.2em}.col h3{font-size:1.1em}.col h4,.col h5,.col h6{font-size:1em}
.col small{font-size:.78em}.col big{font-size:1.25em}
.dock{display:flex;align-items:center;gap:8px;padding:4px 12px;background:var(--surface);flex-shrink:0;font-size:12.5px;height:38px}
.dock input[type=range]{flex:1;accent-color:var(--primary);direction:rtl;min-width:80px;padding:0;border:0;background:none;width:auto}
.chip{padding:3px 10px;border-radius:12px;background:var(--secondaryContainer);color:var(--onSecondaryContainer);white-space:nowrap}
#busy{position:absolute;inset:0;display:none;place-items:center;z-index:25;background:color-mix(in srgb,var(--surface) 75%,transparent)}
#busy.on{display:grid}
.card{background:var(--surfaceContainerHigh);padding:22px 34px;border-radius:12px;text-align:center;min-width:240px}
.bar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--onSurface) 12%,transparent);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid color-mix(in srgb,var(--onSurface) 12%,transparent);border-top-color:var(--primary);margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#hello{position:absolute;inset:0;display:none;place-items:center;text-align:center}
#hello.on{display:grid}#hello .logo,#hello p{display:none}#hello h1{font-size:20px;margin:0 0 12px}
input,select{border:1px solid var(--outline);border-radius:8px;background:var(--surface);color:var(--onSurface);padding:10px 12px;font:inherit;width:100%;caret-color:var(--primary)}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-2px}
.drawer{position:fixed;top:94px;bottom:0;width:min(380px,94vw);z-index:60;background:var(--surfaceContainerHigh);color:var(--onSurface);display:flex;flex-direction:column;transition:transform .2s}
#set,#xt{left:0;transform:translateX(-105%)}#toc{right:0;transform:translateX(105%)}
body.clean .drawer{top:0}body.clean .shade{inset:0}#toc.on,#set.on,#xt.on{transform:none;box-shadow:0 3px 12px color-mix(in srgb,var(--onSurface) 25%,transparent)}
.shade{position:fixed;inset:94px 0 0 0;z-index:55;opacity:0;pointer-events:none}.shade.on{pointer-events:auto}
.dh{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:16px}
.dh .sp{flex:1}
.db{flex:1;overflow:auto;padding:8px 12px}
.empty{padding:32px 10px;text-align:center;color:var(--onSurfaceVariant)}
.tocr{display:flex;width:100%;text-align:start;min-height:42px;align-items:center;padding:8px 12px;border-radius:0;font-size:15px}
.tocr:hover{background:color-mix(in srgb,var(--onSurface) 8%,transparent)}.tocr.l0{font-weight:700}.tocr.cur{background:color-mix(in srgb,var(--primaryContainer) 30%,transparent)}
.fs{padding:12px 4px;display:grid;gap:8px}.fs>.lb{font-size:12.5px;font-weight:700;color:var(--onSurfaceVariant)}
.tg{display:flex;gap:4px;background:var(--surfaceContainerHighest);padding:3px;border-radius:10px}
.tg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13px}.tg button.on{background:var(--primary);color:var(--onPrimary)}
.sw2{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}.sw2 input{width:20px;height:20px;accent-color:var(--primary)}
.toast{position:fixed;bottom:56px;left:50%;transform:translate(-50%,20px);background:var(--onSurface);color:var(--surface);padding:10px 18px;border-radius:8px;z-index:90;opacity:0;transition:.2s;pointer-events:none;font-size:13.5px}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.clean .top,body.clean .tabrow,body.clean .dock{display:none}
/* ספרייה – כמו בספריית אוצריא */
#libview{position:absolute;inset:0;z-index:40;display:none;background:color-mix(in srgb,var(--surfaceContainerHighest) 47.5%,var(--surface))}
html[style*="color-scheme: dark"] #libview{background:#000}
#libview.on{display:flex}
.lv-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#sidePop{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(440px,94%);max-height:72%;display:flex;flex-direction:column;background:var(--surfaceContainerHigh);border-radius:16px;z-index:8;box-shadow:0 6px 24px color-mix(in srgb,var(--onSurface) 28%,transparent)}
#sidePop[hidden]{display:none}
#sideSeg{padding:0;flex:none}#sideSeg button{flex:none;padding:6px 12px}
.lv-tool{display:flex;gap:8px;align-items:center;padding:12px 30px;background:var(--surfaceContainerHigh)}
#qs{max-width:400px;min-height:48px;border:0;border-radius:24px;padding:12px 16px;background:color-mix(in srgb,var(--onSurface) 7%,var(--surfaceContainerHigh))}
#crumbs{display:flex;align-items:center;gap:4px;min-height:36px;overflow-x:auto;padding:4px 12px 0}
#crumbs button{color:var(--onSurfaceVariant);min-height:28px;padding:4px 6px;font-size:12px;white-space:nowrap;border-radius:8px}
#crumbs button.cur{color:var(--primary);font-weight:600}
#lg{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:24px 30px 30px}
.lgrid{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:14px}
.lcard{display:flex;align-items:center;gap:18px;width:100%;aspect-ratio:var(--ratio,1.8);min-height:112px;padding:10px 14px;text-align:start;background:var(--surface);color:var(--onSurface);border-radius:8px}
html[style*="color-scheme: dark"] .lcard{background:var(--surfaceContainer,var(--surface))}
.lcard:hover,.lcard:focus-visible,.lcard.sel{background:color-mix(in srgb,var(--onSurface) 8%,var(--surface))}
.lcard.sel{outline:2px solid var(--primary);outline-offset:-2px}
.lcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lcard .nm{font-size:16px;font-weight:700;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.lcard .au{font-size:12px;color:var(--onSurfaceVariant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;background:var(--secondaryContainer);color:var(--onSecondaryContainer);border-radius:8px}
.ico svg{width:16px;height:16px;stroke-width:1.5}
.lrow{display:flex;align-items:center;gap:8px;min-height:42px;width:100%;padding:8px 12px;padding-inline-start:calc(12px + var(--lv,0)*18px);background:var(--surface);text-align:start;border-radius:0}
html[style*="color-scheme: dark"] .lrow{background:var(--surfaceContainer,var(--surface))}
.lrow:hover{background:color-mix(in srgb,var(--onSurface) 8%,var(--surface))}
.lrow.sel{background:color-mix(in srgb,var(--primaryContainer) 30%,var(--surface))}
.lrow .ico{width:26px;height:26px;flex-basis:26px}
.lrow .lb2{flex:1;min-width:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:18px;height:18px;color:var(--onSurfaceVariant);transform:rotate(90deg)}.lrow.open .chev{transform:rotate(-90deg)}
.lv-side{width:min(360px,38vw);flex:none;display:flex;flex-direction:column;background:var(--surfaceContainerHigh)}
.seg{display:flex;gap:4px;padding:10px 12px 0}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:500;background:var(--surfaceContainerHighest);color:var(--onSurface)}
.seg button.on{background:var(--primary);color:var(--onPrimary)}
.prev{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:22px 8px}
.cover{width:140px;height:190px;border-radius:6px 12px 12px 6px;background:var(--primaryContainer);color:var(--primary);display:grid;place-items:center;padding:14px;font-weight:800;font-size:18px;line-height:1.25;word-break:break-word;box-shadow:inset 7px 0 0 color-mix(in srgb,var(--primary) 25%,transparent)}
.prev h2{margin:0;font-size:18px}.prev .au{color:var(--onSurfaceVariant)}
.prev .ibtn{width:100%;height:40px}
@media (max-width:820px){.lv-side{display:none}.lgrid{--cols:1!important}}
::highlight(wrq){background:#ffe36e;color:#000}
#sideL,#sideR{position:fixed;top:50%;transform:translateY(-50%);z-index:30;width:30px;height:72px;border:0;border-radius:10px;background:var(--surfaceContainerHighest,#8884);color:var(--onSurface,#000);opacity:.18;cursor:pointer;font-size:22px;line-height:72px;padding:0;transition:opacity .15s}
#sideL{left:4px}#sideR{right:4px}#sideL:hover,#sideR:hover,#sideL:focus-visible,#sideR:focus-visible{opacity:.65}
body:not(.reading) #sideL,body:not(.reading) #sideR,body.noside #sideL,body.noside #sideR{display:none}
</style>
</head>
<body class="h">

  <button class="ibtn" id="bToc" title="תוכן עניינים" disabled><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
  <button class="ibtn" id="bNew" title="לשונית חדשה – ספרייה (Ctrl+T)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const O=window.Otzaria;
/* ---------- host / storage ---------- */
async function call(m,p){
  if(!O) throw new Error('יש לפתוח את התוסף מתוך אוצריא');
  const r=await O.call(m,p||{});
  if(r&&typeof r==='object'&&'success' in r){ if(!r.success) throw new Error(r.error&&(r.error.message||r.error.code)||'שגיאה'); return r.data; }
  return r;
}
const sto={
  async get(k){try{const v=await call('storage.get',{key:k});return v&&typeof v==='object'&&'data' in v&&Object.keys(v).length<=2?v.data:v}catch(e){try{return JSON.parse(localStorage.getItem('wr:'+k))}catch(_){return null}}},
  async set(k,v){try{await call('storage.set',{key:k,value:v})}catch(e){try{localStorage.setItem('wr:'+k,JSON.stringify(v))}catch(_){}}}
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const frame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- settings ---------- */
const DEF={fs:25,lh:1.5,cols:2,lines:0,pageW:97,cgap:44,py:20,align:'justify',alast:'right',halign:'center',mode:'h',hideNikud:false,hideTeamim:false,hidePunct:false,holy:'all',holyDisp:'kinuy',alef:false,breakH1:false,pageNums:false,defReader:true,sideBtns:true};
let G={...DEF}, BS={}, curKey=null, scope='all';
const eff=()=>({...G,...(curKey?BS[curKey]||{}:{})});
let ST=eff();
const PERSIST=['holy','holyDisp','alef','defReader','cols','sideBtns'];
async function loadSettings(){const g=await sto.get('settings');if(g&&typeof g==='object')for(const k of PERSIST)if(k in g)G[k]=g[k]}
const saveG=()=>sto.set('settings',Object.fromEntries(PERSIST.map(k=>[k,G[k]])));
async function loadBook(key){BS[key]??=(await sto.get('bs:'+key))||{}}
function setOpt(k,v){if(k==='fs'&&EMB){v=Math.max(14,Math.min(60,v));clearTimeout(setOpt.t);setOpt.t=setTimeout(()=>call('reader.setTextReaderFontSize',{fontSize:v}).catch(()=>{}),250)}G[k]=v;if(PERSIST.includes(k))saveG();ST=eff();applyCss();relayout()}
function applyCss(){
  const r=document.documentElement.style;

/* ---------- export to Word ---------- */
async function exportDoc(ref){
  const key=keyOf(ref),saveKey=curKey;
  busy(true,'מכין קובץ וורד…',0);
  try{
    let tb=tabs.find(t=>t.key===key),secs=tb&&tb.secs;
    if(!secs)secs=await fetchBook({...ref},d=>busy(true,null,Math.min(.5,d/80)));
    curKey=key;await loadBook(key);ST=eff();FSIG='';buildFilters();
    const out=[];
    for(let k=0;k<secs.length;k++){
      const n=makeNode(secs[k]);const tag=n.tagName.toLowerCase();
      out.push(`<${tag}${/^h/.test(tag)?'':' class=MsoNormal'}>${n.innerHTML}</${tag}>`);
      if(k%800===0){busy(true,null,.5+.5*k/secs.length);await frame()}
    }
    const f=Math.round(ST.fs*.75),cols=Math.max(1,ST.cols);
    const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(ref.title)}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:BiDi/></w:WordDocument></xml><![endif]-->
<style>@page Section1{size:21.0cm 29.7cm;margin:1.8cm 1.6cm;mso-columns:${cols} even;mso-column-spacing:.6cm;mso-paper-source:0}
div.Section1{page:Section1}body{direction:rtl;font-family:"David","David",serif;font-size:${f}pt}
p.MsoNormal{margin:0 0 4pt;text-align:${ST.align==='justify'?'justify':ST.align};direction:rtl;line-height:150%;font-size:${f}pt}
h1,h2,h3,h4,h5,h6{direction:rtl;text-align:center;margin:8pt 0 4pt;font-family:"David","David",serif}h1{font-size:${f+8}pt}h2{font-size:${f+5}pt}h3{font-size:${f+2}pt}</style></head>
<body dir="rtl" lang="HE"><div class="Section1" dir="rtl"><h1 style="column-span:all">${esc(ref.title)}</h1>${out.join('\n')}</div></body></html>`;
    const blob=new Blob(['\ufeff',html],{type:'application/msword'});
    const nm=ref.title.replace(/[\\/:*?"<>|]/g,'_');
    let saved=false;
    try{
      const w=await call('fs.beginBinaryWrite',{purpose:'user-file',expectedSize:blob.size});
      const r=await fetch(w.uploadUrl,{method:'PUT',headers:{'Content-Type':blob.type},body:blob});
      if(!r.ok)throw new Error('upload '+r.status);
      const c=await call('fs.commitUserFileWrite',{writeToken:w.writeToken,suggestedName:nm,extension:'doc',title:'שמירת קובץ וורד'});
      if(c&&c.cancelled){busy(false);toast('השמירה בוטלה');return}
      saved=true;
    }catch(e){
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm+'.doc';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),20000);
    }
    toast('קובץ הוורד נוצר ('+cols+' טורים)');
  }catch(e){toast('הייצוא נכשל: '+e.message,5000)}
  finally{curKey=saveKey;ST=eff();FSIG='';busy(false)}
}

    try{await call('plugin.openSelf',{})}catch(e){}
    const t=String(ev&&ev.text||'').trim();if(!t){showLib();return}
    try{const r=await call('library.resolveRef',{ref:t,limit:1}),h=r&&r[0];if(h&&!h.isPdf&&(!h.type||h.type==='text')){openBook({bookId:h.bookId,bookUid:h.bookUid,title:h.title},h.index);return}}catch(e){}
    try{const f=await call('library.findBooks',{query:t,limit:1}),b=f&&f[0];if(b&&(!b.type||b.type==='text')){openBook({bookId:b.bookId||b.title,bookUid:b.bookUid,title:b.title});return}}catch(e){}
    $('#qs').value=t;showLib();
  });
  O.on('theme.changed',applyTheme);O.on('plugin.page_opened',ev=>{if(ev&&ev.source==='newTabButton')showLib()});
  if(O._booted)init();
}else{applyCss();init()}
window.__setOpt=(k,v)=>setOpt(k,v);window.__wr={get cur(){return cur},openBook,relayout,get L(){return L}};
</script>
